<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Paella dibujada con formas, no con el emoji 🥘 como texto: un emoji
       dentro de un SVG depende de que el sistema tenga la fuente y no se
       renderiza en la mayoría de navegadores, que era justo lo que pasaba. -->
  <rect width="100" height="100" rx="18" fill="#0e772e"/>

  <!-- Asas -->
  <circle cx="16" cy="54" r="7.5" fill="none" stroke="#d8d8d8" stroke-width="5"/>
  <circle cx="84" cy="54" r="7.5" fill="none" stroke="#d8d8d8" stroke-width="5"/>

  <!-- Paellera -->
  <ellipse cx="50" cy="54" rx="33" ry="25" fill="#c9ccd1"/>
  <ellipse cx="50" cy="53" rx="28" ry="20.5" fill="#f0a830"/>

  <!-- Arroz -->
  <ellipse cx="50" cy="53" rx="24" ry="17" fill="#f7c44d"/>

  <!-- Ingredientes -->
  <ellipse cx="38" cy="47" rx="6" ry="4.2" fill="#d94f2b" transform="rotate(-18 38 47)"/>
  <ellipse cx="62" cy="49" rx="5.6" ry="4" fill="#d94f2b" transform="rotate(14 62 49)"/>
  <ellipse cx="50" cy="61" rx="6.2" ry="4.2" fill="#c0392b" transform="rotate(-6 50 61)"/>
  <circle cx="40" cy="60" r="3.4" fill="#2e7d32"/>
  <circle cx="61" cy="60" r="3" fill="#2e7d32"/>
  <circle cx="50" cy="45" r="3.2" fill="#2e7d32"/>
  <circle cx="30" cy="53" r="2.8" fill="#e8523f"/>
  <circle cx="70" cy="55" r="2.6" fill="#e8523f"/>
</svg>
